name: Portal Render - Tests
on:
  push:
    branches: [main]
    paths:
      - 'render-web/**'
      - 'tools/migration/**'
      - '.github/workflows/render-web.yml'
  pull_request:
    paths:
      - 'render-web/**'
      - 'tools/migration/**'
      - '.github/workflows/render-web.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Syntax check
        run: |
          npm run check
          node --check catalog.js
          node --check lobby.js
          node --check client-preview.js
          node --check csrf.js
      - name: Test
        run: npm test

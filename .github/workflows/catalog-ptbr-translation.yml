name: DDTank catalog — automated PT-BR translation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/catalog-ptbr-translation.yml']
permissions:
  contents: read
  actions: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /tmp/ddtank-hf-cache
      TOKENIZERS_PARALLELISM: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve catalog from successful SQL restoration
        run: |
          mkdir -p translation-input
          gh run download 43373140020 -n ddtank-original-item-catalog -D translation-input
          ls translation-input/catalog-*.json | wc -l
      - name: Install CPU translation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.49,<5' sentencepiece sacremoses
      - name: Translate every catalog entry (machine suggestions for review)
        run: |
          python tools/migration/Translate-Catalog-PTBR.py --input translation-input --output translation-output
      - name: Upload candidate PT-BR catalog
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ddtank-catalogo-ptbr-modelo-ia
          path: translation-output/
          if-no-files-found: warn
          retention-days: 7

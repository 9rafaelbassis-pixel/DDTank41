name: DDTank SQL backup analysis (ephemeral)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sql-backups-lab.yml'
      - 'tools/migration/Github-Restore-Extract.cjs'
permissions:
  contents: read
jobs:
  extract-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable SQL Server in GitHub Actions
        shell: bash
        run: |
          SA_PASSWORD="DdTank@$(openssl rand -hex 12)A1"
          echo "::add-mask::$SA_PASSWORD"
          echo "SQL_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name ddtank-sql-lab --memory=4g \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -e MSSQL_MEMORY_LIMIT_MB=3072 \
            -p 127.0.0.1:1433:1433 \
            -v "$GITHUB_WORKSPACE/Database:/var/opt/mssql/backups:ro" \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Install temporary SQL client
        run: npm install --prefix tools/migration --no-save mssql@11
      - name: Restore copies and extract schema plus original item catalog
        run: |
          node --check tools/migration/Github-Restore-Extract.cjs
          node tools/migration/Github-Restore-Extract.cjs
      - name: Upload non-sensitive extracted artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddtank-original-item-catalog
          path: migration-output/github-sql-lab/
          if-no-files-found: warn
          retention-days: 7
